spring:
  application:
    name: lifeapi
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:life_api}
    username: ${POSTGRES_USER:life_api_user}
    password: ${POSTGRES_PASSWORD:admin}
    hikari:
      auto-commit: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
